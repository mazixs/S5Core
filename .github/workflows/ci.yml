name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: golang:1.27.4@sha256:5e8afd493a7124a8586e134d9b532731161d4b9becf9dee5a5956b107426f93d

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Install Python for the mandatory script tests
      run: apt-get update && apt-get install -y --no-install-recommends python3

    - name: scripts/pre-commit.sh
      run: ./scripts/pre-commit.sh

    - name: Prometheus rules (promtool check and test)
      if: ${{ !cancelled() }}
      uses: docker://prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
      with:
        entrypoint: /bin/sh
        args: -c "promtool check rules docs/operations/runtime.rules.yml && promtool test rules docs/operations/runtime.rules.test.yml"

    - name: Upload coverage and test diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: coverage
        path: |
          coverage.txt
          .ci-reports/
        include-hidden-files: true
        if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Build the release image without pushing it
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        push: false
        build-args: |
          VERSION=ci-${{ github.sha }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha,scope=ci
        cache-to: type=gha,mode=max,scope=ci

  windows-tests:
    runs-on: windows-2025
    timeout-minutes: 12
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # The version comes from the toolchain line of go.mod, so it is not
    # repeated here.
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod

    - name: Check the Go version and the line endings
      run: |
        want="go$(sed -n 's/^toolchain go//p' go.mod)"
        got="$(go env GOVERSION)"
        [ "$got" = "$want" ] || { echo "go.mod wants $want, the runner has $got"; exit 1; }
        crlf="$(git ls-files --eol | grep -E 'w/(crlf|mixed)' || true)"
        [ -z "$crlf" ] || { printf 'CRLF in the checkout:\n%s\n' "$crlf"; exit 1; }

    - name: go vet
      run: go vet ./...

    # No -race: the runner has the C compiler it needs, but three allocation
    # gates fail under it on Windows. The checks job runs -race on Linux.
    - name: go test
      run: go test -count=1 ./...
