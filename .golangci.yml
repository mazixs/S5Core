# Единственный источник правды по статическому анализу.
# Запускается через scripts/pre-commit.sh, тем же скриптом в CI (см. .github/workflows/ci.yml).
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - makezero
    - nilerr
    - noctx
    - prealloc
    - unconvert
    - wastedassign

  settings:
    errcheck:
      # Ошибка Close/SetDeadline на пути освобождения ресурса недейственна:
      # обработать ее нечем, а обертка `_ =` только прячет реальные находки.
      # Исключение - CloseWrite: его отказ учитывается метрикой (задача Ф1-5).
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (net.PacketConn).Close
        - (net.Conn).SetDeadline
        - (net.Conn).SetReadDeadline
        - (net.Conn).SetWriteDeadline
        - (net.PacketConn).SetDeadline
        - (net.PacketConn).SetReadDeadline
        - (net.PacketConn).SetWriteDeadline
        - (*os.File).Close
        - (*net.TCPConn).Close
        - (*net.TCPConn).SetDeadline
        - (*net.TCPConn).SetReadDeadline
        - (*net.TCPConn).SetWriteDeadline
        - (*net.UDPConn).Close
        - (*net.UDPConn).SetDeadline
        - (*net.UDPConn).SetReadDeadline
        - (*net.UDPConn).SetWriteDeadline
        - (*github.com/mazixs/S5Core/pkg/obfs.Conn).Close
        - (*github.com/mazixs/S5Core/pkg/transport/ws.Conn).Close

  exclusions:
    generated: lax
    rules:
      # В тестах проверка ошибок закрытия и записи не несет смысла:
      # падение теста и так фиксируется утверждениями.
      - path: _test\.go
        linters: [errcheck, noctx, bodyclose, prealloc]
      # Слушателю контекст не нужен: net.Listen не блокируется и снимается
      # через Close. noctx остается включенным для Dial и HTTP - там он
      # указывает на реальное отсутствие дедлайна (задачи Ф3-1, Ф3-3).
      - linters: [noctx]
        text: "net.Listen must not be called"

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
