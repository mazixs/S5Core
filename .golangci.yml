# Общий конфиг для локального прогона и CI: scripts/pre-commit.sh.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - makezero
    - nilerr
    - noctx
    - prealloc
    - unconvert
    - wastedassign

  settings:
    errcheck:
      # Ошибки очистки игнорируются; CloseWrite остается под проверкой.
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (net.PacketConn).Close
        - (net.Conn).SetDeadline
        - (net.Conn).SetReadDeadline
        - (net.Conn).SetWriteDeadline
        - (net.PacketConn).SetDeadline
        - (net.PacketConn).SetReadDeadline
        - (net.PacketConn).SetWriteDeadline
        - (*os.File).Close
        - (*net.TCPConn).Close
        - (*net.TCPConn).SetDeadline
        - (*net.TCPConn).SetReadDeadline
        - (*net.TCPConn).SetWriteDeadline
        - (*net.UDPConn).Close
        - (*net.UDPConn).SetDeadline
        - (*net.UDPConn).SetReadDeadline
        - (*net.UDPConn).SetWriteDeadline
        - (*github.com/mazixs/S5Core/pkg/obfs.Conn).Close
        - (*github.com/mazixs/S5Core/pkg/transport/ws.Conn).Close

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [errcheck, noctx, bodyclose, prealloc]
      # Жизненным циклом слушателя управляет Close; Dial и HTTP проверяются.
      - linters: [noctx]
        text: "net.Listen must not be called"

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
