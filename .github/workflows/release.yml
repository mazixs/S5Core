name: Release and Publish Docker

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  checks:
    runs-on: ubuntu-24.04
    container: golang:1.26.6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: scripts/pre-commit.sh
        run: ./scripts/pre-commit.sh

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-checks
          path: |
            coverage.txt
            .ci-reports/
          include-hidden-files: true
          if-no-files-found: ignore

  build-and-push-docker:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-github-release:
    needs: [checks, build-and-push-docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Build binaries
        env:
          LDFLAGS: -s -w -X github.com/mazixs/S5Core/internal/buildinfo.version=${{ github.ref_name }}
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/s5core-linux-amd64 ./cmd/s5core
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/s5core-linux-arm64 ./cmd/s5core
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/s5core-darwin-amd64 ./cmd/s5core
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/s5core-darwin-arm64 ./cmd/s5core
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/s5core-windows-amd64.exe ./cmd/s5core
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/s5client-linux-amd64 ./cmd/s5client
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/s5client-linux-arm64 ./cmd/s5client
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/s5client-darwin-amd64 ./cmd/s5client
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/s5client-darwin-arm64 ./cmd/s5client
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/s5client-windows-amd64.exe ./cmd/s5client
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -ldflags="$LDFLAGS" -o dist/s5client-linux-mipsle-softfloat ./cmd/s5client
          GOOS=linux GOARCH=mips GOMIPS=softfloat go build -ldflags="$LDFLAGS" -o dist/s5client-linux-mips-softfloat ./cmd/s5client

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
