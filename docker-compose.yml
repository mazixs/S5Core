services:
  s5core:
    image: ${S5CORE_IMAGE:-ghcr.io/mazixs/s5core:2.0.0}
    restart: always
    env_file: .env
    environment:
      PROXY_LISTEN_IP: 0.0.0.0
      PROXY_PORT: ${PROXY_PORT:-1080}
      OBFS_PORT: ${OBFS_PORT:-1443}
      METRICS_BIND_ADDR: 0.0.0.0
      METRICS_PORT: ${METRICS_PORT:-8080}
    ports:
      - "${OBFS_PORT:-1443}:${OBFS_PORT:-1443}"
      # Plain SOCKS5 and metrics stay private on the host.
      - "127.0.0.1:${PROXY_PORT:-1080}:${PROXY_PORT:-1080}"
      - "127.0.0.1:${METRICS_PORT:-8080}:${METRICS_PORT:-8080}"
