name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: golang:1.26.9@sha256:f1f0bcc2c524a3ced375fcb4d1ecb7aa371aa7070e112599aaca45cc02d0101b

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Install Python for the mandatory script tests
      run: apt-get update && apt-get install -y --no-install-recommends python3

    - name: scripts/pre-commit.sh
      run: ./scripts/pre-commit.sh

    - name: Upload coverage and test diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: coverage
        path: |
          coverage.txt
          .ci-reports/
        include-hidden-files: true
        if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Build the release image without pushing it
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        push: false
        build-args: |
          VERSION=ci-${{ github.sha }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha,scope=ci
        cache-to: type=gha,mode=max,scope=ci
