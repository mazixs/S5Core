name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: golang:1.26.8

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: scripts/pre-commit.sh
      run: ./scripts/pre-commit.sh

    - name: Upload coverage and test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: |
          coverage.txt
          .ci-reports/
        include-hidden-files: true
        if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - uses: docker/setup-buildx-action@v4

    - name: Build the release image without pushing it
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        build-args: |
          VERSION=ci-${{ github.sha }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha,scope=ci
        cache-to: type=gha,mode=max,scope=ci
