# WAN: the server and the origins on a remote host, client and generator on another
# (a router), both over ssh. Copy it under bench/ (gitignored) and put the real
# addresses there: an address does not belong in the repository.
# About 85 MB of traffic per cell at scale 0.2; 15 cells here come to about 1.3 GB.
name = "wan"
description = "raw, 2.1.0 и 2.2 rc (рабочее дерево) на настоящем пути"
base = "v210"
candidate = "rc"

[wan]
server = "root@SERVER_IP"       # ssh target; systemd-run, curl and ss are needed there
client = "router"               # ssh target; BusyBox with awk, nc, nohup and sha256sum is enough
client_arch = "arm64"
server_dir = "/root/s5bench"    # both directories are wiped on staging and removed after the run
client_dir = "/opt/tmp/s5bench"

[defaults]
auth = "member"
scale = 0.2
scenario_timeout = "2m"
hang_grace = "20s"
settle = "3s"
retries = 1
slow_ms = 150
server_procs = 1
client_procs = 3
gen_procs = 3

[env.client]
OBFS_FORMAT = "v1"              # a 2.1 client refuses member-only without it; 2.2 reads it as its only format

[variants.raw]
direct = true
title = "без прокси"

[variants.v210]
ref = "v2.1.0"
title = "2.1.0 (база)"

[variants.rc]
ref = "worktree"
title = "2.2 rc (рабочее дерево)"

[[series]]
name = "wan"
title = "WAN"
network = "wan"
rounds = 3
only = ["tcp/connect", "=tcp/echo-64", "=http/small-new", "=https/small-new", "=h2/small-reuse", "=h3/small-new", "=h3/small-reuse",
        "=http/large", "=http/upload", "=h3/large", "=udp/rtt-64", "=udp/stream-40mbit", "=udp/sweep-5mbit"]
