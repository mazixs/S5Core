services:

  s5core:
    # build: .
    restart: always
    image: ghcr.io/mazixs/s5core:latest
    env_file: .env
    ports:
      - "1080:1080"
      - "1443:1443"
      # Metrics exposed on localhost only by default.
      # Change METRICS_BIND_ADDR in .env to 0.0.0.0:8080 for external scraping.
      - "127.0.0.1:8080:8080"
