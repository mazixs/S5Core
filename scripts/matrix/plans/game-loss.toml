# Game session on a lossy client-server leg: native encrypted UDP, 0x83,
# plain SOCKS5 UDP and the path without a proxy.
# RTT 50 ms as on the measured field node, random loss 0-5% and outages in time
# (a fade drops everything for a spell; loss_pct is then the share of time).
# Ten minutes per cell. The series form one group: all 56 cells run at once,
# unpinned, since a 64 Hz stream loads a core by a few percent. About 12 minutes.
name = "game-loss"
description = "игровая сессия под потерями: native UDP и 0x83 против прямого пути"
base = "tcp"
candidate = "native"

[defaults]
auth = "none"
scale = 0.16666667
scenario_timeout = "13m"
hang_grace = "1m"
settle = "3s"
retries = 1
sample_s = 60

[variants.raw]
direct = true
title = "без прокси"

[variants.tcp]
ref = "worktree"
title = "0x83"
[variants.tcp.env.client]
UDP_NATIVE = "false"

[variants.native]
ref = "worktree"
title = "native UDP"
[variants.native.env.server]
UDP_PORT = "41443"
[variants.native.env.client]
UDP_NATIVE = "true"

[guard]
max_foreign_cores = 4.0
load_wait = "120s"

[[series]]
name = "clean"
title = "RTT 50 мс, без потерь"
network = { rtt_ms = 50, loss_pct = 0 }
transports = ["plain", "obfs", "wss"]
compare = []
group = "loss"
only = ["=game/64hz-200b"]

[[series]]
name = "loss05"
title = "RTT 50 мс, потери 0,5%"
network = { rtt_ms = 50, loss_pct = 0.5 }
transports = ["plain", "obfs", "wss"]
compare = []
group = "loss"
only = ["=game/64hz-200b"]

[[series]]
name = "loss1"
title = "RTT 50 мс, потери 1%"
network = { rtt_ms = 50, loss_pct = 1 }
transports = ["plain", "obfs", "wss"]
compare = []
group = "loss"
only = ["=game/64hz-200b"]

[[series]]
name = "loss2"
title = "RTT 50 мс, потери 2%"
network = { rtt_ms = 50, loss_pct = 2 }
transports = ["plain", "obfs", "wss"]
compare = []
group = "loss"
only = ["=game/64hz-200b"]

[[series]]
name = "loss5"
title = "RTT 50 мс, потери 5%"
network = { rtt_ms = 50, loss_pct = 5 }
transports = ["plain", "obfs", "wss"]
compare = []
group = "loss"
only = ["=game/64hz-200b"]

[[series]]
name = "fade1"
title = "RTT 50 мс, провалы по 30 мс, 1% времени"
network = { rtt_ms = 50, loss_pct = 1, loss_outage_ms = 30 }
transports = ["plain", "obfs", "wss"]
